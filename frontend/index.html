<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loan default prediction system</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="head-panel">
        <div class="logo">
          <img src="loan_logo.png" alt="Loan Prediction Logo" />
        </div>

        <div>
          <h1>Loan Default Prediction</h1>
          <p>Enter loan applicant details to predict default risk</p>
        </div>
      </div>
    </header>

    <main>
      <div class="content">
        <form id="prediction-form">
          <div class="applicant-info">
            <div class="form-head">
              <i class="fa-solid fa-circle-user"></i>
              <h2>Applicant information</h2>
            </div>
            <div class="details">
              <div class="details-part1">
                <div class="details1">
                  <label for="loan_amnt">Loan Amount (₹)</label>
                  <input
                    type="number"
                    id="loan_amnt"
                    name="loan_amnt"
                    placeholder="Enter loan amount"
                  />

                  <label for="int_rate">Interest Rate (%)</label>
                  <input
                    type="number"
                    id="int_rate"
                    name="int_rate"
                    step="0.01"
                    placeholder="Enter Interest Rate"
                  />

                  <label for="">Installment (₹)</label>
                  <input
                    type="number"
                    id="installment"
                    name="installment"
                    placeholder="Enter Installment amount"
                  />

                  <label for="">Grade</label>
                  <select id="grade" name="grade">
                    <option value="" disabled selected>Select grade</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                    <option value="E">E</option>
                    <option value="F">F</option>
                    <option value="G">G</option>
                  </select>

                  <label for="">Home ownership</label>
                  <select id="home_ownership" name="home_ownership">
                    <option value="" disabled selected>
                      Select Home ownership type
                    </option>
                    <option value="MORTGAGE">MORTGAGE</option>
                    <option value="RENT">RENT</option>
                    <option value="OWN">OWN</option>
                    <option value="ANY">ANY</option>
                    <option value="NONE">NONE</option>
                    <option value="OTHER">OTHER</option>
                  </select>

                  <label for="">Annual Income (₹)</label>
                  <input
                    type="number"
                    id="annual_inc"
                    name="annual_inc"
                    placeholder="Enter your annual income"
                  />
                </div>
              </div>

              <div class="details-part2">
                <div class="details2">
                  <label for="verification_status">Verification status</label>

                  <select
                    id="verification_status"
                    name="verification_status"
                    required
                  >
                    <option value="" disabled selected>
                      Select your verification status
                    </option>

                    <option value="Verified">Verified</option>
                    <option value="Source Verified">Source Verified</option>
                    <option value="Not Verified">Not Verified</option>
                  </select>

                  <label for="purpose">Purpose</label>
                  <select id="purpose" name="purpose" required>
                    <option value="" disabled selected>Select purpose</option>

                    <option value="debt_consolidation">
                      Debt Consolidation
                    </option>
                    <option value="small_business">Small Business</option>
                    <option value="home_improvement">Home Improvement</option>
                    <option value="major_purchase">Major Purchase</option>
                    <option value="credit_card">Credit Card</option>
                    <option value="other">Other</option>
                    <option value="house">House</option>
                    <option value="vacation">Vacation</option>
                    <option value="car">Car</option>
                    <option value="medical">Medical</option>
                    <option value="moving">Moving</option>
                    <option value="renewable_energy">Renewable Energy</option>
                    <option value="wedding">Wedding</option>
                    <option value="educational">Educational</option>
                  </select>

                  <label for="dti">DTI (%)</label>
                  <input
                    type="number"
                    id="dti"
                    name="dti"
                    step="0.01"
                    placeholder="Enter DTI"
                    required
                  />

                  <label for="term_class">Term Class</label>
                  <select id="term_class" name="term_class" required>
                    <option value="" disabled selected>
                      Select term class
                    </option>
                    <option value="Short-term">Short-term</option>
                    <option value="Long-term">Long-term</option>
                  </select>

                  <label for="emp_class">Employment Class</label>
                  <select id="emp_class" name="emp_class" required>
                    <option value="" disabled selected>
                      Select employment class
                    </option>
                    <option value="Junior">Junior</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Experienced">Experienced</option>
                    <option value="Veteran">Veteran</option>
                  </select>

                  <div class="predict-button">
                    <button type="submit" class="predict-btn">Predict</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </form>
        <div class="result" id="prediction-result">
          <div class="result-head">
            <i class="fa-solid fa-chart-simple"></i>
            <p>Prediction Result</p>
          </div>
          <div class="prediction-result">
            <p class="result-para1">No prediction yet</p>
            <p class="result-para2">
              Fill in the form and click "Predict" to see result
            </p>
          </div>
        </div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
